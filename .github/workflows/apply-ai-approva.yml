name: Apply AI approva files

on:
  push:
    branches:
      - chatgpt-ai-approva-transfer
    paths:
      - '.github/workflows/apply-ai-approva.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode exact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-approva
          cat .transfer/payload.part* | base64 -d > /tmp/ai-approva/four-files.tar.gz
          echo '67a7da53302fe4ae8b4dcd97f92028fb88cc65da18d5cc6ca4945be88a83d651  /tmp/ai-approva/four-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ai-approva/four-files.tar.gz -C /tmp/ai-approva
          test "$(git hash-object /tmp/ai-approva/src/lib/server/agent.ts)" = '7efe3ab2afed8b9f6400e7600e704cfe63b614be'
          test "$(git hash-object /tmp/ai-approva/src/lib/server/db.ts)" = 'b92c75f39dd52f97cd06e0aa7f052997edf3f6a3'
          test "$(git hash-object /tmp/ai-approva/src/lib/server/runAnalysis.ts)" = '2ef8d680cc9224997d6f1ea4c58a59ab3af9ad9e'
          test "$(git hash-object /tmp/ai-approva/src/lib/server/validateSignal.ts)" = 'bb7afb9563d2519ba6c720b28619bd2f19b86d8b'

      - name: Commit four files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/ai-approva/src/lib/server/agent.ts src/lib/server/agent.ts
          cp /tmp/ai-approva/src/lib/server/db.ts src/lib/server/db.ts
          cp /tmp/ai-approva/src/lib/server/runAnalysis.ts src/lib/server/runAnalysis.ts
          cp /tmp/ai-approva/src/lib/server/validateSignal.ts src/lib/server/validateSignal.ts
          git add src/lib/server/agent.ts src/lib/server/db.ts src/lib/server/runAnalysis.ts src/lib/server/validateSignal.ts
          git commit -m "il codice costruisce il trade, l'AI lo approva o lo rifiuta"
          git push origin main
