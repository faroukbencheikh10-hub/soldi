name: Sync tested Production state

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-production-bootstrap.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 2

      - name: Checkout staged tested payload
        uses: actions/checkout@v4
        with:
          ref: sync-production-20260827
          path: staging

      - name: Verify base and reconstruct tested source
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git rev-parse HEAD^)" = "7e05ec21226241e082ca025e7c13355d8249beaa"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sync-production-bootstrap.yml"
          cd ..
          cat staging/.sync/chunk* | base64 -d > /tmp/production-sync.tar.gz
          tar -xzf /tmp/production-sync.tar.gz -C repo

      - name: Verify exact tested file hashes
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          check() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            echo "$file $actual"
            test "$actual" = "$expected"
          }
          check src/lib/server/agent.ts 3eb678726bb7626a1ae5fcbb80ee0804af3fddc7
          check src/lib/server/setupState.ts b6c0a276afd00a8a85d519f5134d5ed318bcf269
          check src/lib/server/runAnalysis.ts 409f33154af0192e644eddc1046547e5e182ec40
          check src/lib/server/db.ts 738f640efb9968294326e99d704574d25074ddce
          check package.json 8f12052e20153801f0dd91435e99204d72ea6d81
          check src/app/api/debug/sources/route.ts 55d3a0f57ff0a9d111d17f4ab156a009916eccb1

      - name: Commit exact tested Production state
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/server/agent.ts \
            src/lib/server/setupState.ts \
            src/lib/server/runAnalysis.ts \
            src/lib/server/db.ts \
            package.json \
            src/app/api/debug/sources/route.ts
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Sync tested Production state"
          git push origin HEAD:main

      - name: Remove staging branch
        if: success()
        shell: bash
        run: |
          cd repo
          git push origin --delete sync-production-20260827 || true
